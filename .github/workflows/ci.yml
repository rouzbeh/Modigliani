name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            libboost-filesystem-dev libboost-program-options-dev \
            libboost-random-dev libboost-system-dev \
            liblua5.4-dev lua5.4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config boost lua

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          autoreconf -f -v -i
          mkdir -p build
          cd build
          if [ "$RUNNER_OS" = "macOS" ]; then
            ../configure --with-boost="$(brew --prefix)"
          else
            ../configure
          fi

      - name: Build
        run: make -C build -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Unit tests
        run: ./build/test/tests

      # The evidence that the model is intact is in the recording, not in
      # whether it compiled: require a real action potential.
      - name: Check the simulation spikes
        run: python3 .github/check_spike.py build/src/auxsrc/modigliani

      # Same assertion with the channel noise switched off, so the
      # deterministic solver is covered on its own terms.
      - name: Check the deterministic solver spikes
        run: |
          python3 .github/check_spike.py build/src/auxsrc/modigliani \
            examples/sga_suprathreshold.json --algorithm 1

      # The at-threshold example fires about eight times in ten by design,
      # so it is run for cleanliness rather than asserted on.
      - name: Run the at-threshold example
        run: |
          cd examples
          ../build/src/auxsrc/modigliani --config-file sga.json

      # A fixed seed must give byte-identical output twice running.
      - name: Check --seed reproducibility
        run: python3 .github/check_reproducible.py build/src/auxsrc/modigliani

  docs:
    name: documentation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            libboost-filesystem-dev libboost-program-options-dev \
            libboost-random-dev libboost-system-dev \
            liblua5.4-dev lua5.4 \
            doxygen graphviz

      - name: Build the documentation
        run: ./doc/build_docs.sh "$GITHUB_WORKSPACE/build"

      - uses: actions/upload-artifact@v4
        with:
          name: html-documentation
          path: doc/html
          retention-days: 14

      # Publish to the gh-pages branch that already backs
      # https://rouzbeh.github.io/Modigliani - only from master, never from
      # pull requests.
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          cd doc/html
          touch .nojekyll
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Documentation for ${GITHUB_SHA::7}"
          git push -f -q \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
